spring.application.name=biblioteca
server.port=8080

# H2 local em arquivo: executa sem Docker/MySQL e preserva os dados em ./data.
# Para usar MySQL, informe DB_URL, DB_USERNAME, DB_PASSWORD e DB_DRIVER no ambiente.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/biblioteca;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.h2.console.enabled=true

# Atualiza o esquema JPA durante o desenvolvimento.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
