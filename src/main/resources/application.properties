spring.application.name=biblioteca
server.port=8080

# MySQL 8.4 iniciado pelo compose.yaml. Para outro servidor, sobrescreva as variáveis DB_*.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:biblioteca}
spring.datasource.password=${DB_PASSWORD:biblioteca_dev_2026}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Atualiza o esquema JPA durante o desenvolvimento.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
