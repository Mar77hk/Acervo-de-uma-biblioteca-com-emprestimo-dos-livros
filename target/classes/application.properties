spring.application.name=biblioteca
server.port=8080

# Banco H2 em arquivo: os dados continuam salvos depois de fechar a aplicacao.
spring.datasource.url=jdbc:h2:file:./data/biblioteca;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console de desenvolvimento do H2 (use somente localmente).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
