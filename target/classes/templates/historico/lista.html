<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n="historyPageTitle">Histórico do acervo</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{fragments :: header}"></div><div th:replace="~{fragments :: accessibility}"></div>
<main class="container">
  <div class="page-heading"><div><p class="eyebrow" data-i18n="collectionAudit">AUDITORIA DO ACERVO</p><h1 data-i18n="historyHeading">Histórico de movimentações</h1><p data-i18n="historyDescription">Entradas, cadastros, empréstimos, devoluções, manutenções e descartes.</p></div></div>
  <form method="get" th:action="@{/historico}" class="filter-panel compact">
    <label><span data-i18n="movementType">Tipo de movimentação</span><select name="tipo"><option value="" data-i18n="all">Todas</option><option th:each="t : ${ {'LIVRO_CADASTRADO','LIVRO_ATUALIZADO','EXEMPLAR_CADASTRADO','AUTOR_CADASTRADO','EDITORA_CADASTRADA','USUARIO_CADASTRADO','EMPRESTIMO','DEVOLUCAO','MANUTENCAO','DESCARTE'} }" th:value="${t}" th:text="${t}" th:selected="${t == tipoSelecionado}" data-i18n-enum></option></select></label>
    <div class="filter-actions"><button class="button primary" type="submit" data-i18n="filter">Filtrar</button><a class="button secondary" th:href="@{/historico}" data-i18n="clear">Limpar</a></div>
  </form>
  <div class="table-wrap"><table><thead><tr><th data-i18n="dateTimeColumn">Data e hora</th><th data-i18n="typeColumn">Tipo</th><th data-i18n="descriptionColumn">Descrição</th><th data-i18n="responsibleColumn">Responsável</th></tr></thead>
    <tbody>
      <tr th:each="m : ${movimentacoes}"><td th:text="${#temporals.format(m.dataHora, 'dd/MM/yyyy HH:mm')}"></td><td><span class="status" th:text="${m.tipo}" data-i18n-enum></span></td><td th:text="${m.descricao}"></td><td th:text="${m.responsavel}"></td></tr>
      <tr th:if="${#lists.isEmpty(movimentacoes)}"><td colspan="4" class="empty" data-i18n="historyEmpty">Nenhuma movimentação registrada.</td></tr>
    </tbody>
  </table></div>
</main>
<div th:replace="~{fragments :: footer}"></div><script th:src="@{/js/accessibility.js}"></script>
</body></html>
